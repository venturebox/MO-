<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <!-- Soft Underbody Ground Shadow -->
    <radialGradient id="qashqaiGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Pearl White Car Body -->
    <linearGradient id="qashqaiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Smoked Bronze/Brown Tinted Glass (mObywatel 3D avatar palette) -->
    <linearGradient id="qashqaiGlass" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3d2c22" />
      <stop offset="45%" stop-color="#594335" />
      <stop offset="80%" stop-color="#4a372b" />
      <stop offset="100%" stop-color="#2d1f18" />
    </linearGradient>

    <!-- Windshield Reflection -->
    <linearGradient id="qashqaiWindshield" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4e3b30" />
      <stop offset="50%" stop-color="#675042" />
      <stop offset="100%" stop-color="#3b2b21" />
    </linearGradient>

    <!-- SUV Wheel Rim -->
    <linearGradient id="qashqaiRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="128" cy="119" rx="88" ry="12" fill="url(#qashqaiGroundShadow)" />

  <!-- Rear Bumper & Underbody Shadow -->
  <path d="M 188 92 L 210 86 Q 214 90 211 98 L 190 102 Z" fill="#cbd5e1" />

  <!-- SUV Wheel Arch Protective Black Cladding (Rear & Front) -->
  <path d="M 96 98 C 96 86, 118 84, 126 95 Z" fill="#334155" />
  <path d="M 176 89 C 176 77, 198 75, 204 86 Z" fill="#334155" />

  <!-- Main Qashqai J12 Crossover Body Shell -->
  <path d="M 38 95 
           C 36 88, 42 79, 50 72 
           C 60 64, 74 56, 92 50 
           C 110 44, 134 43, 166 45 
           C 188 46, 206 52, 214 65 
           C 217 71, 216 79, 210 85 
           L 206 87 
           C 205 82, 200 76, 194 73 
           L 186 72 
           L 186 98 
           C 182 100, 174 102, 164 103 
           L 126 105 
           L 124 94 
           C 120 85, 106 84, 100 89 
           L 96 94 
           L 96 106 
           C 72 107, 52 106, 42 102 
           C 38 100, 37 98, 38 95 Z" 
        fill="url(#qashqaiBody)" />

  <!-- Qashqai J12 V-Motion Front Grille (Signature Nissan V-Shape) -->
  <path d="M 40 94 
           L 44 88 
           L 58 87 
           L 74 88 
           L 78 95 
           C 76 102, 66 105, 56 105 
           C 46 105, 41 101, 40 94 Z" 
        fill="#261b15" />

  <!-- Chrome V-Motion Trim Accent -->
  <path d="M 43 90 L 52 102 L 66 102 L 74 90" stroke="#cbd5e1" stroke-width="2.2" fill="none" stroke-linejoin="round" />

  <!-- Nissan Logo in Grille Center -->
  <circle cx="59" cy="95" r="3.2" fill="#e2e8f0" />
  <circle cx="59" cy="95" r="1.8" fill="#1e293b" />
  <rect x="56" y="94.2" width="6" height="1.6" fill="#e2e8f0" />

  <!-- Sharp Boomerang LED Headlights (Qashqai J12 signature split headlights) -->
  <!-- Left Headlight Top DRL -->
  <path d="M 40 85 L 56 82 L 48 87 Z" fill="#93c5fd" />
  <path d="M 41 85 L 56 82" stroke="#ffffff" stroke-width="1.2" />

  <!-- Right Headlight Top DRL -->
  <path d="M 72 82 L 86 84 L 78 86 Z" fill="#93c5fd" />
  <path d="M 73 82 L 86 84" stroke="#ffffff" stroke-width="1.2" />

  <!-- Hood (Sculpted creases on Qashqai hood) -->
  <path d="M 46 84 C 54 77, 72 71, 92 70 C 86 77, 70 85, 48 87 Z" fill="#ffffff" />
  <path d="M 52 79 C 62 74, 82 71, 98 70" stroke="#e2e8f0" stroke-width="1.4" fill="none" />
  <path d="M 64 82 C 76 77, 92 74, 104 74" stroke="#e2e8f0" stroke-width="1" fill="none" />

  <!-- Windshield (Raked SUV Windshield) -->
  <path d="M 72 68 
           L 122 74 
           L 138 56 
           L 102 50 Z" 
        fill="url(#qashqaiWindshield)" />
  <path d="M 76 67 L 114 72 L 124 62 L 88 58 Z" fill="#ffffff" opacity="0.2" />

  <!-- White Transverse Roof Bar -->
  <path d="M 102 50 
           L 138 56 
           L 142 51 
           L 110 46 Z" 
        fill="#ffffff" 
        stroke="#e2e8f0" 
        stroke-width="0.8" />

  <!-- Panoramic Glass Roof Pane -->
  <path d="M 111 46 
           C 124 43, 154 43, 184 46 
           C 194 47, 202 50, 200 54 
           C 198 58, 174 60, 143 58 
           L 142 52 Z" 
        fill="url(#qashqaiGlass)" />
  <path d="M 122 45 C 140 44, 170 44, 188 46" stroke="#a8a29e" stroke-width="1.2" fill="none" opacity="0.6" />

  <!-- Roof Rail / Floating Roof Arch -->
  <path d="M 102 50 
           C 126 42, 170 42, 204 50 
           C 212 52, 216 56, 212 60 
           L 208 58 
           C 202 52, 172 46, 142 47 
           L 110 46 Z" 
        fill="#ffffff" />
  <!-- Silver Roof Rail Bar -->
  <path d="M 116 43 C 142 41, 174 41, 196 46" stroke="#94a3b8" stroke-width="1.2" fill="none" />

  <!-- Side Windows (Two-tone floating roofline) -->
  <path d="M 125 74 
           L 152 69 
           L 154 55 
           L 138 56 Z" 
        fill="url(#qashqaiGlass)" />
  <path d="M 154 69 
           L 190 65 
           C 198 63, 202 56, 196 54 
           L 156 55 Z" 
        fill="url(#qashqaiGlass)" />

  <!-- Black B-Pillar -->
  <line x1="153" y1="55" x2="153" y2="69" stroke="#1f1610" stroke-width="2.5" />

  <!-- Qashqai Sculpted Side Shoulder Crease -->
  <path d="M 92 82 C 120 78, 158 74, 200 70" stroke="#cbd5e1" stroke-width="1.5" fill="none" />
  <path d="M 96 86 C 124 82, 162 78, 196 75" stroke="#ffffff" stroke-width="1.2" fill="none" />

  <!-- Door Handles -->
  <rect x="140" y="74" width="6" height="1.6" rx="0.8" fill="#64748b" />
  <rect x="171" y="70" width="6" height="1.6" rx="0.8" fill="#64748b" />

  <!-- Boomerang Tail Light Notch -->
  <path d="M 210 64 L 213 70 L 210 73 Z" fill="#ef4444" />

  <!-- FRONT SUV WHEEL -->
  <g>
    <ellipse cx="110" cy="98" rx="12" ry="14.5" fill="#1e293b" />
    <ellipse cx="110" cy="98" rx="10" ry="12.5" fill="#0f172a" />
    <ellipse cx="110" cy="98" rx="8" ry="10" fill="url(#qashqaiRim)" />
    <!-- 5-Spoke SUV Rim Details -->
    <ellipse cx="110" cy="98" rx="3.5" ry="5" fill="#f8fafc" />
    <circle cx="110" cy="98" r="1.6" fill="#475569" />
  </g>

  <!-- REAR SUV WHEEL -->
  <g>
    <ellipse cx="190" cy="88" rx="12" ry="14.5" fill="#1e293b" />
    <ellipse cx="190" cy="88" rx="10" ry="12.5" fill="#0f172a" />
    <ellipse cx="190" cy="88" rx="8" ry="10" fill="url(#qashqaiRim)" />
    <!-- 5-Spoke SUV Rim Details -->
    <ellipse cx="190" cy="88" rx="3.5" ry="5" fill="#f8fafc" />
    <circle cx="190" cy="88" r="1.6" fill="#475569" />
  </g>
</svg>
