<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <!-- Soft Underbody Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Pearl White Car Body -->
    <linearGradient id="whiteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Smoked Brown/Bronze Tinted Glass (mObywatel 3D asset style) -->
    <linearGradient id="smokedGlass" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#3d2c22" />
      <stop offset="45%" stop-color="#594335" />
      <stop offset="80%" stop-color="#4a372b" />
      <stop offset="100%" stop-color="#2d1f18" />
    </linearGradient>

    <!-- Windshield Reflection -->
    <linearGradient id="windshieldGlass" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4e3b30" />
      <stop offset="50%" stop-color="#675042" />
      <stop offset="100%" stop-color="#3b2b21" />
    </linearGradient>

    <!-- Bumper Intake -->
    <linearGradient id="darkIntake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2b21" />
      <stop offset="100%" stop-color="#251a14" />
    </linearGradient>

    <!-- White Rim Wheel with Depth -->
    <linearGradient id="wheelRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- 1. Ground Shadow (Matches angle of car) -->
  <ellipse cx="128" cy="118" rx="88" ry="12" fill="url(#groundShadow)" />

  <!-- 2. Far Right Rear Silhouette / Bumper Shadow -->
  <path d="M 188 92 L 208 86 Q 212 90 209 98 L 190 102 Z" fill="#cbd5e1" />

  <!-- 3. Main Car Body Outer Silhouette -->
  <!-- Low front nose at (42, 94), sweeping up to roofline at (105, 46) down to rear at (212, 68) -->
  <path d="M 42 94 
           C 40 88, 44 80, 52 74 
           C 60 67, 72 58, 88 52 
           C 104 46, 126 44, 158 45 
           C 184 46, 204 53, 212 66 
           C 215 72, 214 80, 208 86 
           L 204 88 
           C 204 84, 202 78, 196 74 
           L 190 73 
           L 190 98 
           C 186 100, 178 102, 168 103 
           L 126 105 
           L 124 94 
           C 120 86, 108 84, 102 89 
           L 98 94 
           L 98 106 
           C 74 107, 54 106, 44 102 
           C 40 100, 41 97, 42 94 Z" 
        fill="url(#whiteBody)" />

  <!-- 4. Front Bumper Lower Air Intake (Characteristic dark trapezoid) -->
  <path d="M 43 96 
           C 44 92, 50 89, 64 89 
           C 74 89, 78 92, 79 97 
           C 78 103, 72 105, 60 105 
           C 48 105, 43 101, 43 96 Z" 
        fill="url(#darkIntake)" />

  <!-- Thin Upper Grille Line across Nose -->
  <path d="M 44 87 C 52 84, 68 83, 84 86" stroke="#475569" stroke-width="1.6" fill="none" stroke-linecap="round" />

  <!-- Front Headlight Glints -->
  <path d="M 45 84 C 47 82, 53 82, 55 84 C 52 86, 48 86, 45 84 Z" fill="#93c5fd" opacity="0.85" />
  <path d="M 78 84 C 81 83, 86 84, 88 86 C 85 87, 80 86, 78 84 Z" fill="#93c5fd" opacity="0.85" />

  <!-- 5. Front Hood Sculpted Panel -->
  <path d="M 48 84 C 54 78, 68 73, 86 73 C 82 79, 68 87, 48 88 Z" fill="#ffffff" />
  <path d="M 54 79 C 64 74, 82 72, 94 72" stroke="#e2e8f0" stroke-width="1.2" fill="none" />

  <!-- 6. Windshield (Front Smoked Glass) -->
  <!-- Angled dark smoked bronze glass -->
  <path d="M 68 70 
           L 115 76 
           L 132 58 
           L 98 52 Z" 
        fill="url(#windshieldGlass)" />

  <!-- Windshield Reflection Sheen -->
  <path d="M 72 69 L 108 74 L 118 64 L 84 60 Z" fill="#ffffff" opacity="0.18" />

  <!-- 7. White Transverse Roof Bar (Key feature identified in user photo) -->
  <!-- Distinct white structural roof bar between windshield and panoramic roof -->
  <path d="M 98 52 
           L 132 58 
           L 136 53 
           L 105 48 Z" 
        fill="#ffffff" 
        stroke="#e2e8f0" 
        stroke-width="0.8" />

  <!-- 8. Panoramic Glass Roof (Dark Smoked Bronze Pane) -->
  <!-- Large panoramic glass insert filling the roof -->
  <path d="M 106 48 
           C 118 45, 148 45, 178 48 
           C 188 49, 196 52, 194 56 
           C 192 60, 168 62, 137 60 
           L 136 54 Z" 
        fill="url(#smokedGlass)" />

  <!-- Subtle Panoramic Roof Highlight -->
  <path d="M 116 47 C 132 46, 162 46, 182 48" stroke="#a8a29e" stroke-width="1.2" fill="none" opacity="0.6" />

  <!-- White Outer Roof Arch Frame (Surrounding the panoramic glass) -->
  <path d="M 98 52 
           C 120 44, 162 44, 198 52 
           C 206 54, 210 58, 206 62 
           L 202 60 
           C 196 54, 168 48, 137 49 
           L 105 48 Z" 
        fill="#ffffff" />

  <!-- 9. Side Greenhouse (Smoked Glass Windows) -->
  <!-- Front Door Window -->
  <path d="M 119 76 
           L 146 71 
           L 148 57 
           L 132 58 Z" 
        fill="url(#smokedGlass)" />

  <!-- Rear Door Window / Quarter Glass (Smooth curved arch) -->
  <path d="M 148 71 
           L 186 67 
           C 194 65, 198 58, 192 56 
           L 150 57 Z" 
        fill="url(#smokedGlass)" />

  <!-- B-Pillar Divider (Thin body pillar) -->
  <line x1="147" y1="57" x2="147" y2="71" stroke="#261b15" stroke-width="2.2" />

  <!-- 10. Side Body Sculpture & Doors -->
  <!-- Shoulder line crease running across doors -->
  <path d="M 88 84 C 114 80, 152 76, 194 72" stroke="#cbd5e1" stroke-width="1.4" fill="none" />
  <path d="M 92 88 C 118 84, 156 80, 190 77" stroke="#ffffff" stroke-width="1" fill="none" />

  <!-- Door Handles (Subtle dark marks from user image) -->
  <rect x="134" y="76" width="6" height="1.6" rx="0.8" fill="#64748b" />
  <rect x="165" y="72" width="6" height="1.6" rx="0.8" fill="#64748b" />

  <!-- Rear Quarter Panel / Tail Lamp Slit -->
  <path d="M 206 66 L 208 72 L 206 74 Z" fill="#ef4444" opacity="0.9" />

  <!-- 11. FRONT WHEEL (Left) - Tilted Isometric Disc Rim -->
  <g>
    <!-- Black Tire Outer -->
    <ellipse cx="106" cy="98" rx="11" ry="14" fill="#1e293b" />
    <ellipse cx="106" cy="98" rx="9" ry="12" fill="#0f172a" />
    <!-- White / Silver Disc Rim (Matches user photo) -->
    <ellipse cx="106" cy="98" rx="7.5" ry="10" fill="url(#wheelRim)" />
    <!-- Inner Hub Shadow -->
    <ellipse cx="106" cy="98" rx="3.5" ry="5" fill="#f8fafc" />
    <circle cx="106" cy="98" r="1.5" fill="#64748b" />
  </g>

  <!-- 12. REAR WHEEL (Left) - Tilted Isometric Disc Rim -->
  <g>
    <!-- Black Tire Outer -->
    <ellipse cx="186" cy="88" rx="11" ry="14" fill="#1e293b" />
    <ellipse cx="186" cy="88" rx="9" ry="12" fill="#0f172a" />
    <!-- White / Silver Disc Rim (Matches user photo) -->
    <ellipse cx="186" cy="88" rx="7.5" ry="10" fill="url(#wheelRim)" />
    <!-- Inner Hub Shadow -->
    <ellipse cx="186" cy="88" rx="3.5" ry="5" fill="#f8fafc" />
    <circle cx="186" cy="88" r="1.5" fill="#64748b" />
  </g>
</svg>
